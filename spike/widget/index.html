<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anatomy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 420px;
        overflow: hidden;
        border-radius: 12px;
        background: linear-gradient(180deg, #0f1720 0%, #1b2733 100%);
      }
      #root canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      .status {
        position: absolute;
        top: 8px;
        left: 10px;
        z-index: 2;
        font-size: 11px;
        line-height: 1.4;
        color: #9fb3c8;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
        max-width: calc(100% - 20px);
      }
      .cta {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 2;
        font: inherit;
        font-size: 12px;
        color: #d7e3ef;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .cta:hover {
        background: rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
